services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    volumes:
      - taskboard_data:/app/data
      - taskboard_uploads:/app/app/static/uploads
    networks:
      - taskboard_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - taskboard_net

networks:
  taskboard_net:
    driver: bridge

volumes:
  taskboard_data:
  taskboard_uploads:
  caddy_data:
  caddy_config:
