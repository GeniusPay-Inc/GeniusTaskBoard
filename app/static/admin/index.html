<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskBoard — Back-office</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f0f2f7;
    --column-bg: #e4e8f0;
    --card-bg: #ffffff;
    --ink: #172b4d;
    --muted: #5e6c84;
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
    --border: #dfe3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  a { color: var(--brand); }

  /* ---------- Header ---------- */
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 12px clamp(12px, 2vw, 24px); background: #fff; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), #7c3aed);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px;
  }
  .brand h1 { font-size: 17px; margin: 0; }
  .brand .sub { font-size: 11px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-actions .links a { font-size: 13px; text-decoration: none; margin-right: 6px; }
  .key-pill {
    display: flex; align-items: center; gap: 6px; background: #f4f5f8; border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 10px 5px 12px; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .key-pill.set { color: var(--ok); border-color: #bbf0cf; background: #f0fdf5; }
  .key-pill.bad { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
  .key-pill .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }

  button { cursor: pointer; border: none; border-radius: 8px; font-family: inherit; }
  button.primary { background: var(--brand); color: #fff; padding: 8px 14px; font-size: 13px; font-weight: 600; }
  button.primary:hover { background: var(--brand-dark); }
  button.ghost { background: #eef1f5; color: var(--ink); padding: 8px 14px; font-size: 13px; font-weight: 600; }
  button.subtle { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 12px; }
  button.danger-text { background: transparent; color: var(--danger); padding: 4px 8px; font-size: 12px; }
  button.small { padding: 5px 9px; font-size: 12px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Onboarding banner ---------- */
  #onboarding {
    background: #fff7ed; border-bottom: 1px solid #fed7aa; padding: 12px clamp(12px, 2vw, 24px);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  #onboarding[hidden] { display: none; }
  #onboarding.error { background: #fef2f2; border-bottom-color: #fecaca; }
  #onboarding .icon { font-size: 20px; }
  #onboarding .text { flex: 1; min-width: 240px; font-size: 13px; line-height: 1.5; }
  #onboarding .text b { display: block; font-size: 14px; margin-bottom: 2px; }
  #onboarding .text code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }
  #onboarding form { display: flex; gap: 6px; }
  #onboarding input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 220px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 14px clamp(12px, 2vw, 24px) 4px;
  }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-chip {
    background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 600; color: var(--muted); display: flex; gap: 6px; align-items: center;
  }
  .stat-chip b { color: var(--ink); font-size: 13px; }
  .toolbar .actions { display: flex; gap: 8px; }

  /* ---------- Board ---------- */
  .board {
    display: flex; gap: 14px; padding: 12px clamp(12px, 2vw, 24px) 24px; overflow-x: auto;
    align-items: flex-start; min-height: 60vh;
  }
  .column {
    background: var(--column-bg); border-radius: 12px; padding: 10px; width: 300px; flex: 0 0 300px;
    display: flex; flex-direction: column; max-height: calc(100vh - 190px);
  }
  .column.drag-over { outline: 2px dashed var(--brand); outline-offset: -2px; }
  .column-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
  .column-head .name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 7px; }
  .column-head .flag { width: 8px; height: 8px; border-radius: 999px; }
  .column-head .count { background: rgba(0,0,0,.08); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
  .card-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-bottom: 4px; min-height: 40px; }
  .card-list .empty { font-size: 12px; color: var(--muted); padding: 10px 6px; }

  .card {
    background: var(--card-bg); border-radius: 10px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(9,30,66,.15);
    cursor: grab; border-left: 4px solid var(--border);
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card.a_faire { border-left-color: #94a3b8; }
  .card.en_cours { border-left-color: var(--brand); }
  .card.en_retard { border-left-color: var(--danger); animation: pulseCard 1.6s ease-in-out infinite; }
  .card.terminee { border-left-color: var(--ok); }
  @keyframes pulseCard { 0%,100% { box-shadow: 0 1px 2px rgba(9,30,66,.15); } 50% { box-shadow: 0 0 0 3px rgba(220,38,38,.25); } }

  .card .title { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; line-height: 1.35; }
  .card .desc { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .avatars { display: flex; }
  .avatar {
    width: 24px; height: 24px; border-radius: 999px; color: #fff; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 2px solid var(--card-bg); margin-left: -8px;
  }
  .avatar:first-child { margin-left: 0; }
  .time-chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .time-chip.neutral { background: #eef1f5; color: var(--muted); }
  .time-chip.ok { background: #dcfce7; color: #166534; }
  .time-chip.warn { background: #fef3c7; color: #92400e; }
  .time-chip.danger { background: #fee2e2; color: #991b1b; }
  .card .card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card .card-actions button { flex: 1; }

  .add-card-btn {
    background: transparent; color: var(--muted); text-align: left; padding: 8px 6px; font-size: 12.5px;
    font-weight: 600; border-radius: 8px;
  }
  .add-card-btn:hover { background: rgba(9,30,66,.06); color: var(--ink); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(9,30,66,.5); display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 100;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }
  .modal label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
  .modal input[type=text], .modal input[type=number], .modal textarea, .modal select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal .checks { display: flex; flex-wrap: wrap; gap: 8px; max-height: 140px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .modal .checks label { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 13px; color: var(--ink); margin: 0; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* ---------- Team panel ---------- */
  #teamPanel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 90vw); background: #fff; z-index: 90;
    box-shadow: -4px 0 16px rgba(9,30,66,.15); transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  #teamPanel.open { transform: translateX(0); }
  #teamPanel .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
  #teamPanel .panel-head h2 { font-size: 15px; margin: 0; }
  #teamPanel .panel-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  .person-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f2f5; }
  .person-row .info { flex: 1; }
  .person-row .name { font-size: 13.5px; font-weight: 600; }
  .person-row .role { font-size: 11.5px; color: var(--muted); }
  #overlay-scrim { position: fixed; inset: 0; background: rgba(9,30,66,.4); z-index: 80; }
  #overlay-scrim[hidden] { display: none; }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: #16a34a; color: #fff;
    padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 13px; opacity: 0; max-width: 320px;
    transform: translateY(10px); transition: all .3s ease; z-index: 200; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.completed { background: #2563eb; }
  .toast.overdue { background: #dc2626; }

  @media (max-width: 640px) {
    .column { width: 82vw; flex-basis: 82vw; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">TB</div>
      <div>
        <h1>TaskBoard</h1>
        <div class="sub">Back-office</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="links">
        <a href="/dashboard" target="_blank">Écran de suivi ↗</a>
        <a href="/docs" target="_blank">API ↗</a>
      </div>
      <button class="key-pill" id="keyPill" title="Configurer la clé API"><span class="dot"></span><span id="keyPillLabel">Clé API non configurée</span></button>
    </div>
  </header>

  <div id="onboarding" hidden>
    <span class="icon">🔑</span>
    <div class="text" id="onboardingText"></div>
    <form id="onboardingForm">
      <input id="onboardingInput" type="password" placeholder="Coller la clé API…" autocomplete="off" />
      <button class="primary" type="submit">Enregistrer</button>
    </form>
  </div>

  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="ghost" id="openTeamBtn">👥 Personnel</button>
      <button class="primary" id="openTaskModalBtn">+ Nouvelle tâche</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <!-- Modale : nouvelle tâche -->
  <div class="modal-backdrop" id="taskModalBackdrop" hidden>
    <div class="modal">
      <h2>Nouvelle tâche</h2>
      <form id="taskForm">
        <label>Titre</label>
        <input type="text" id="taskTitre" required />
        <label>Description</label>
        <textarea id="taskDescription"></textarea>
        <label>Minutes allouées (temps confié pour la réalisation)</label>
        <input type="number" id="taskMinutes" min="1" required value="15" />
        <label>Affilier à</label>
        <div class="checks" id="taskUserChecks"><span class="empty">Aucun personnel — ajoutez d'abord une personne.</span></div>
        <div class="modal-footer">
          <button type="button" class="ghost" id="cancelTaskModal">Annuler</button>
          <button class="primary" type="submit">Créer la tâche</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panneau : personnel -->
  <div id="overlay-scrim" hidden></div>
  <aside id="teamPanel">
    <div class="panel-head">
      <h2>Personnel</h2>
      <button class="subtle" id="closeTeamBtn">✕</button>
    </div>
    <div class="panel-body">
      <form id="userForm" style="margin-bottom:16px;">
        <label style="font-size:12px;font-weight:700;color:var(--muted);">Prénom</label>
        <input type="text" id="userPrenom" required style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin:4px 0 8px;" />
        <label style="font-size:12px;font-weight:700;color:var(--muted);">Nom</label>
        <input type="text" id="userNom" required style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin:4px 0 8px;" />
        <label style="font-size:12px;font-weight:700;color:var(--muted);">Rôle</label>
        <select id="userRole" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin:4px 0 10px;">
          <option value="employe">Employé</option>
          <option value="admin">Admin</option>
        </select>
        <button class="primary" type="submit" style="width:100%;padding:9px;">Ajouter</button>
      </form>
      <div id="userList"><p class="empty" style="font-size:12px;color:var(--muted);">Chargement…</p></div>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script>
    const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    const COLUMNS = [
      { key: "a_faire", label: "À faire", flag: "#94a3b8" },
      { key: "en_cours", label: "En cours", flag: "#2563eb" },
      { key: "en_retard", label: "En retard", flag: "#dc2626" },
      { key: "terminee", label: "Terminées", flag: "#16a34a" },
    ];
    let users = [];
    let tasks = [];
    let lastAuthError = false;

    // ---------- Clé API ----------
    function apiKey() { return localStorage.getItem("taskboard_api_key") || ""; }
    function setApiKey(v) { localStorage.setItem("taskboard_api_key", v.trim()); refreshKeyPill(); }
    function refreshKeyPill() {
      const pill = document.getElementById("keyPill");
      const label = document.getElementById("keyPillLabel");
      if (lastAuthError) { pill.className = "key-pill bad"; label.textContent = "Clé API invalide"; }
      else if (apiKey()) { pill.className = "key-pill set"; label.textContent = "Clé API configurée"; }
      else { pill.className = "key-pill"; label.textContent = "Clé API non configurée"; }
      renderOnboarding();
    }
    function renderOnboarding() {
      const box = document.getElementById("onboarding");
      const text = document.getElementById("onboardingText");
      if (lastAuthError) {
        box.hidden = false; box.className = "error";
        text.innerHTML = "<b>Clé API refusée par le serveur.</b>Vérifiez qu'elle correspond exactement à la valeur <code>API_KEY</code> définie dans le fichier <code>.env</code> du serveur, puis resaisissez-la ci-contre.";
      } else if (!apiKey()) {
        box.hidden = false; box.className = "";
        text.innerHTML = "<b>Configurez la clé API avant de créer du personnel ou des tâches.</b>Elle correspond à la valeur <code>API_KEY</code> du fichier <code>.env</code> du serveur (demandez-la à la personne qui l'a déployé). La clé est ensuite mémorisée dans ce navigateur.";
      } else {
        box.hidden = true;
      }
    }
    document.getElementById("keyPill").addEventListener("click", () => {
      document.getElementById("onboarding").hidden = false;
      document.getElementById("onboardingInput").focus();
    });
    document.getElementById("onboardingForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("onboardingInput").value;
      if (!v.trim()) return;
      setApiKey(v);
      lastAuthError = false;
      document.getElementById("onboardingInput").value = "";
      refreshKeyPill();
      loadAll();
    });

    // ---------- API ----------
    async function api(path, options = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (options.method && options.method !== "GET") headers["X-API-Key"] = apiKey();
      const res = await fetch("/api/v1" + path, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        lastAuthError = true; refreshKeyPill();
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || "Clé API manquante ou invalide");
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Erreur ${res.status}`);
      }
      if (options.method && options.method !== "GET") { lastAuthError = false; refreshKeyPill(); }
      return res.status === 204 ? null : res.json();
    }

    // ---------- Sons / toast ----------
    function beep(freq = 880, duration = 180) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.frequency.value = freq; osc.type = "sine";
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + duration / 1000);
      } catch (e) {}
    }
    function showToast(text, cls) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.className = "toast show " + (cls || "");
      setTimeout(() => toast.classList.remove("show"), 3500);
    }

    // ---------- Avatars ----------
    const AVATAR_COLORS = ["#2563eb", "#7c3aed", "#db2777", "#d97706", "#16a34a", "#0891b2", "#dc2626"];
    function colorFor(id) {
      let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function initials(u) { return ((u.prenom[0] || "") + (u.nom[0] || "")).toUpperCase(); }

    // ---------- Rendu stats ----------
    function renderStats() {
      const counts = { a_faire: 0, en_cours: 0, en_retard: 0, terminee: 0 };
      tasks.forEach(t => { if (counts[t.statut] !== undefined) counts[t.statut]++; });
      const actifs = users.filter(u => u.statut === "actif").length;
      document.getElementById("stats").innerHTML = `
        <div class="stat-chip">👥 <b>${actifs}</b> actifs</div>
        <div class="stat-chip">📋 <b>${tasks.filter(t => t.statut !== 'archivee').length}</b> tâches</div>
        <div class="stat-chip">🔴 <b>${counts.en_retard}</b> en retard</div>`;
    }

    // ---------- Rendu board ----------
    function timeChip(t) {
      if (t.statut === "terminee") return `<span class="time-chip ok">✓ terminée</span>`;
      if (!t.date_fin_prevue) return `<span class="time-chip neutral">${t.minutes_allouees} min</span>`;
      const ms = new Date(t.date_fin_prevue) - new Date();
      const cls = ms <= 0 ? "danger" : ms < 5 * 60 * 1000 ? "warn" : "ok";
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const label = ms <= 0 ? "écoulé" : `${Math.floor(totalSec / 60)}:${(totalSec % 60).toString().padStart(2, "0")}`;
      return `<span class="time-chip ${cls}" data-fin="${t.date_fin_prevue}">${label}</span>`;
    }

    function cardHtml(t) {
      const av = (t.assigned_users || []).slice(0, 4).map(u =>
        `<div class="avatar" style="background:${colorFor(u.id)}" title="${u.prenom} ${u.nom}">${initials(u)}</div>`).join("");
      const actions = [];
      if (t.statut === "a_faire") actions.push(`<button class="primary small" onclick="startTask('${t.id}')">▶ Démarrer</button>`);
      if (t.statut === "en_cours" || t.statut === "en_retard") actions.push(`<button class="primary small" onclick="completeTask('${t.id}')">✓ Terminer</button>`);
      if (t.statut !== "archivee") actions.push(`<button class="ghost small" onclick="archiveTask('${t.id}')">🗄</button>`);
      return `
        <div class="card ${t.statut}" draggable="true" data-id="${t.id}" data-statut="${t.statut}">
          <div class="title">${escapeHtml(t.titre)}</div>
          ${t.description ? `<div class="desc">${escapeHtml(t.description)}</div>` : ""}
          <div class="meta-row">
            <div class="avatars">${av || '<span style="font-size:11px;color:var(--muted);">Non affilié</span>'}</div>
            ${timeChip(t)}
          </div>
          <div class="card-actions">${actions.join("")}</div>
        </div>`;
    }

    function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = COLUMNS.map(col => {
        const items = tasks.filter(t => t.statut === col.key);
        return `
          <div class="column" data-status="${col.key}">
            <div class="column-head">
              <span class="name"><span class="flag" style="background:${col.flag}"></span>${col.label}</span>
              <span class="count">${items.length}</span>
            </div>
            <div class="card-list" data-status="${col.key}">
              ${items.length ? items.map(cardHtml).join("") : '<div class="empty">Aucune tâche</div>'}
            </div>
            ${col.key === "a_faire" ? '<button class="add-card-btn" id="inlineAddTask">+ Ajouter une tâche</button>' : ""}
          </div>`;
      }).join("");
      document.getElementById("inlineAddTask")?.addEventListener("click", openTaskModal);
      wireDragAndDrop();
    }

    function tickTimers() {
      document.querySelectorAll(".time-chip[data-fin]").forEach(el => {
        const fin = el.getAttribute("data-fin");
        const ms = new Date(fin) - new Date();
        const cls = ms <= 0 ? "danger" : ms < 5 * 60 * 1000 ? "warn" : "ok";
        el.className = "time-chip " + cls;
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        el.textContent = ms <= 0 ? "écoulé" : `${Math.floor(totalSec / 60)}:${(totalSec % 60).toString().padStart(2, "0")}`;
      });
    }
    setInterval(tickTimers, 1000);

    // ---------- Drag & drop (façon Trello) ----------
    function wireDragAndDrop() {
      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("dragstart", (e) => {
          card.classList.add("dragging");
          e.dataTransfer.setData("text/plain", JSON.stringify({ id: card.dataset.id, from: card.dataset.statut }));
        });
        card.addEventListener("dragend", () => card.classList.remove("dragging"));
      });
      document.querySelectorAll(".column").forEach(col => {
        col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drag-over"); });
        col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
        col.addEventListener("drop", async (e) => {
          e.preventDefault(); col.classList.remove("drag-over");
          const data = JSON.parse(e.dataTransfer.getData("text/plain") || "{}");
          const to = col.dataset.status;
          if (!data.id || data.from === to) return;
          try {
            if (data.from === "a_faire" && to === "en_cours") await startTask(data.id, false);
            else if ((data.from === "en_cours" || data.from === "en_retard") && to === "terminee") await completeTask(data.id, false);
            else { showToast("Déplacement non pris en charge — utilisez les boutons de la carte.", ""); return; }
            await loadAll();
          } catch (err) { showToast(err.message, "overdue"); }
        });
      });
    }

    // ---------- Actions tâches ----------
    async function startTask(id, reload = true) { try { await api(`/tasks/${id}/start`, { method: "POST" }); if (reload) await loadAll(); } catch (e) { showToast(e.message, "overdue"); } }
    async function completeTask(id, reload = true) { try { await api(`/tasks/${id}/complete`, { method: "POST" }); if (reload) await loadAll(); } catch (e) { showToast(e.message, "overdue"); } }
    async function archiveTask(id) { try { await api(`/tasks/${id}/archive`, { method: "POST" }); await loadAll(); } catch (e) { showToast(e.message, "overdue"); } }
    async function archiveUser(id) { try { await api(`/users/${id}/archive`, { method: "POST" }); await loadAll(); } catch (e) { showToast(e.message, "overdue"); } }

    // ---------- Modale tâche ----------
    function openTaskModal() {
      const checks = document.getElementById("taskUserChecks");
      const actifs = users.filter(u => u.statut === "actif");
      checks.innerHTML = actifs.length
        ? actifs.map(u => `<label><input type="checkbox" value="${u.id}" /> ${u.prenom} ${u.nom}</label>`).join("")
        : '<span class="empty">Aucun personnel actif — ajoutez d\'abord une personne.</span>';
      document.getElementById("taskModalBackdrop").hidden = false;
      document.getElementById("taskTitre").focus();
    }
    function closeTaskModal() { document.getElementById("taskModalBackdrop").hidden = true; document.getElementById("taskForm").reset(); }
    document.getElementById("openTaskModalBtn").addEventListener("click", openTaskModal);
    document.getElementById("cancelTaskModal").addEventListener("click", closeTaskModal);
    document.getElementById("taskModalBackdrop").addEventListener("click", (e) => { if (e.target.id === "taskModalBackdrop") closeTaskModal(); });

    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const userIds = Array.from(document.querySelectorAll("#taskUserChecks input:checked")).map(i => i.value);
      try {
        await api("/tasks", { method: "POST", body: JSON.stringify({
          titre: document.getElementById("taskTitre").value.trim(),
          description: document.getElementById("taskDescription").value.trim() || null,
          minutes_allouees: parseInt(document.getElementById("taskMinutes").value, 10),
          user_ids: userIds,
        })});
        closeTaskModal();
        document.getElementById("taskMinutes").value = 15;
        await loadAll();
      } catch (err) { showToast(err.message, "overdue"); }
    });

    // ---------- Panneau personnel ----------
    function openTeamPanel() { document.getElementById("teamPanel").classList.add("open"); document.getElementById("overlay-scrim").hidden = false; }
    function closeTeamPanel() { document.getElementById("teamPanel").classList.remove("open"); document.getElementById("overlay-scrim").hidden = true; }
    document.getElementById("openTeamBtn").addEventListener("click", openTeamPanel);
    document.getElementById("closeTeamBtn").addEventListener("click", closeTeamPanel);
    document.getElementById("overlay-scrim").addEventListener("click", closeTeamPanel);

    function renderUserList() {
      const list = document.getElementById("userList");
      if (!users.length) { list.innerHTML = '<p class="empty" style="font-size:12px;color:var(--muted);">Aucune personne enregistrée.</p>'; return; }
      list.innerHTML = users.map(u => `
        <div class="person-row">
          <div class="avatar" style="background:${colorFor(u.id)};margin-left:0;">${initials(u)}</div>
          <div class="info">
            <div class="name">${u.prenom} ${u.nom}</div>
            <div class="role">${u.role} · ${u.statut}</div>
          </div>
          ${u.statut === "actif" ? `<button class="danger-text" onclick="archiveUser('${u.id}')">Archiver</button>` : ""}
        </div>`).join("");
    }

    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await api("/users", { method: "POST", body: JSON.stringify({
          prenom: document.getElementById("userPrenom").value.trim(),
          nom: document.getElementById("userNom").value.trim(),
          role: document.getElementById("userRole").value,
        })});
        e.target.reset();
        await loadAll();
      } catch (err) { showToast(err.message, "overdue"); }
    });

    // ---------- Chargement ----------
    async function loadAll() {
      try {
        [users, tasks] = await Promise.all([api("/users"), api("/tasks")]);
        renderStats(); renderBoard(); renderUserList();
      } catch (e) { console.error(e); }
    }

    function connectWS() {
      const ws = new WebSocket(WS_URL);
      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === "task.created") { showToast(`Nouvelle tâche : ${msg.task.titre}`, ""); beep(880, 200); }
        else if (msg.type === "task.completed") { showToast(`Tâche terminée : ${msg.task.titre}`, "completed"); beep(520, 250); }
        else if (msg.type === "task.overdue") { showToast(`Tâche en retard : ${msg.task.titre}`, "overdue"); beep(300, 350); }
        loadAll();
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    refreshKeyPill();
    loadAll();
    connectWS();
  </script>
</body>
</html>
