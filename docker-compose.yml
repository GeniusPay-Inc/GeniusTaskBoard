services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - taskboard_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

# IMPORTANT — ne JAMAIS lancer `docker compose down -v` (ni supprimer ces
# volumes manuellement) en production : c'est le seul moyen pour la base de
# données et les photos de disparaître. Un `git pull` / `git clean` / un
# nouveau `docker compose up --build` ne touchent jamais ces volumes nommés,
# gérés par Docker en dehors du dossier du projet. Voir le README (section
# « Déploiement ») pour la procédure de migration si vous mettiez à jour
# depuis une ancienne version qui utilisait des bind mounts (./data, ./uploads).
#
# NOTE : ce fichier docker-compose.yml sert pour un déploiement VPS manuel.
# Sur une plateforme managée qui construit directement le Dockerfile (Railway,
# Render, Fly.io…), docker-compose.yml n'est PAS utilisé — voir le README
# pour la configuration du volume persistant équivalent sur ces plateformes.
volumes:
  caddy_data:
  caddy_config:
  taskboard_data:
